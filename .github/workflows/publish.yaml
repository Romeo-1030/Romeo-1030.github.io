name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate poster thumbnails
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p poster-thumbs
          pdftoppm -jpeg -f 1 -singlefile -r 180 posters/neural-scaling.pdf poster-thumbs/neural-scaling
          pdftoppm -jpeg -f 1 -singlefile -r 180 posters/dae.pdf poster-thumbs/dae
          pdftoppm -jpeg -f 1 -singlefile -r 180 posters/slac.pdf poster-thumbs/slac
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
