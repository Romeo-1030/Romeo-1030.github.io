name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate poster PDFs
        run: |
          python -m pip install --quiet pillow
          mkdir -p posters
          python - <<'PY'
          from PIL import Image
          items = [
              ("assets/neural-scaling-poster.jpg", "posters/neural-scaling-poster.pdf"),
              ("assets/dae-poster.jpg", "posters/dae-poster.pdf"),
              ("assets/slac-poster.jpg", "posters/slac-poster.pdf"),
          ]
          for src, dst in items:
              im = Image.open(src).convert("RGB")
              im.save(dst, "PDF", resolution=150.0)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
